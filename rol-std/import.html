<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>River of Light — Save the Date (Canva import)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Allura&family=Marcellus&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
/* Importer rules (learned on DAHSL_cKqUQ): explicit bg per page, no border-radius,
   no SVG filters, no gradient fills on small elements, images as <img>, Canva-mapped fonts. */
:root{
  --ink:#171A2E; --ivory:#F2EBDD; --ivory-dim:#C9C0B0;
  --marigold:#C98A2B; --marigold-lift:#E0B15F;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ink);color:var(--ivory);font-family:"EB Garamond",Georgia,serif;font-size:26px;line-height:1.55}
section{background:var(--ink);width:1600px;min-height:2400px;position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;text-align:center}
.inner{position:relative;z-index:2;width:1100px}
.stack>*+*{margin-top:30px}
.label{font-family:"Marcellus",serif;text-transform:uppercase;letter-spacing:.34em;font-size:24px;color:var(--ivory-dim)}
.script{font-family:"Allura",cursive;font-size:150px;line-height:1;color:var(--ivory)}
.names{font-family:"Marcellus",serif;font-size:84px;letter-spacing:.12em;line-height:1.2}
.date{font-family:"Marcellus",serif;font-size:44px;letter-spacing:.24em;color:var(--marigold-lift)}
.rule{width:110px;height:2px;background:var(--marigold);margin:0 auto}
.ital{font-style:italic;font-size:30px;color:var(--ivory-dim)}
.open{font-family:"Marcellus",serif;text-transform:uppercase;letter-spacing:.42em;font-size:24px;
  color:var(--marigold-lift);text-indent:.42em}
.count td{font-family:"Marcellus",serif;font-size:74px;color:var(--ivory);padding:0 34px;line-height:1.1}
.count .u td{font-family:"Marcellus",serif;font-size:20px;letter-spacing:.28em;text-transform:uppercase;color:var(--ivory-dim);padding-top:8px}
table.count{margin:0 auto;border-collapse:collapse}
</style>
</head>
<body>

<!-- ============ PAGE 1 · THE LOCK SCREEN ============ -->
<section id="lock" data-document-role="page" data-label="Envelope">
  <img src="https://antara-builds.github.io/dbl-demos/rol-std/palace_bg.jpg" alt=""
       style="position:absolute;left:0;top:0;width:1600px;height:2400px;object-fit:cover;z-index:0">
  <div class="inner stack">
    <p class="label">You have an invitation from</p>
    <p class="script">Meera &amp; Arjun</p>
    <div class="rule"></div>
    <img src="https://antara-builds.github.io/dbl-demos/rol-std/envelope_closed.png" alt="envelope"
         style="width:860px;margin:60px auto 0;display:block">
    <p class="open">Tap the envelope to open</p>
  </div>
</section>

<!-- ============ PAGE 2 · THE REVEAL (same world, envelope now open) ============ -->
<section id="reveal" data-document-role="page" data-label="Save Our Date">
  <img src="https://antara-builds.github.io/dbl-demos/rol-std/palace_bg.jpg" alt=""
       style="position:absolute;left:0;top:0;width:1600px;height:2400px;object-fit:cover;z-index:0">
  <div class="inner stack">
    <img src="https://antara-builds.github.io/dbl-demos/rol-std/envelope_open.png" alt="opened envelope"
         style="width:760px;margin:0 auto;display:block">
    <p class="script">Save our Date</p>
    <p class="names">MEERA &amp; ARJUN</p>
    <p class="date">14 · 02 · 2027 — UDAIPUR</p>
    <div class="rule"></div>
    <table class="count">
      <tr><td>181</td><td>:</td><td>23</td><td>:</td><td>55</td></tr>
      <tr class="u"><td>days</td><td></td><td>hours</td><td></td><td>minutes</td></tr>
    </table>
    <p class="ital">Formal invitation and website to follow.<br>
       With love, from our families to yours.</p>
    <p class="label">questions · meera.arjun@example.com</p>
  </div>
</section>

</body>
</html>
