<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lace Save the Date — replica (Canva import)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Allura&family=Marcellus&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
/* Faithful structural replica of the StudioGwyn sd-lace bestseller, on our own assets.
   Importer rules: explicit bg per page, no border-radius/SVG filters/small gradients,
   images as <img>, Canva-mapped fonts only. */
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0A0A08;color:#F5F1E6;font-family:"EB Garamond",Georgia,serif;font-size:26px;line-height:1.5}
section{width:1600px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center}
.inner{position:relative;z-index:2;width:1160px}
.stack>*+*{margin-top:34px}
.caps{font-family:"Marcellus",serif;text-transform:uppercase;letter-spacing:.42em;font-size:26px;color:#F5F1E6;text-indent:.42em}
.caps-dim{font-family:"Marcellus",serif;text-transform:uppercase;letter-spacing:.42em;font-size:24px;color:#DAD4C4;text-indent:.42em}
.script{font-family:"Allura",cursive;font-size:170px;line-height:1;color:#F7F3E8}
.mono{font-family:"Allura",cursive;font-size:120px;line-height:1;color:#1C1A15}
</style>
</head>
<body>

<!-- ============ PAGE 1 · YOU'VE GOT MAIL (dark, painting, envelope) ============ -->
<section id="lock" data-document-role="page" data-label="You've Got Mail" style="background:#0A0A08;min-height:2400px">
  <img src="https://antara-builds.github.io/dbl-demos/gwyn-std/calla_bg.jpg" alt=""
       style="position:absolute;left:0;top:0;width:1600px;height:2400px;object-fit:cover;z-index:0">
  <div class="inner stack">
    <p class="caps">You've got mail from</p>
    <p class="script">Isabella &amp; Thomas</p>
    <div style="position:relative;width:880px;margin:70px auto 0">
      <img src="https://antara-builds.github.io/dbl-demos/gwyn-std/envelope_closed.png" alt="envelope"
           style="width:880px;display:block">
      <p style="position:absolute;left:0;top:250px;width:880px;font-family:'Allura',cursive;font-size:96px;color:#2B2822">It</p>
    </div>
    <p class="caps" style="margin-top:70px">Tap envelope to open</p>
  </div>
</section>

<!-- ============ PAGE 2 · SAVE OUR DATE (dark, veil card over the painting) ============ -->
<section id="reveal" data-document-role="page" data-label="Save Our Date" style="background:#0A0A08;min-height:2200px">
  <img src="https://antara-builds.github.io/dbl-demos/gwyn-std/calla_bg.jpg" alt=""
       style="position:absolute;left:0;top:0;width:1600px;height:2200px;object-fit:cover;z-index:0">
  <div class="inner" style="display:flex;justify-content:center">
    <div style="width:820px;padding:90px 60px;border:3px solid #F1ECDD;outline:1px solid #F1ECDD;outline-offset:14px;background:rgba(20,20,16,.55)">
      <p style="font-family:'Allura',cursive;font-size:130px;line-height:1.05;color:#F7F3E8">Save our<br>Date</p>
      <p class="caps-dim" style="margin-top:56px">Isabella &amp; Thomas</p>
      <p class="caps-dim" style="margin-top:26px">22 July 2027</p>
    </div>
  </div>
</section>

<!-- ============ PAGE 3 · THE CREAM SIGN-OFF (monogram, contact, countdown) ============ -->
<section id="signoff" data-document-role="page" data-label="With Love" style="background:#FFFDF4;min-height:2200px;color:#1C1A15">
  <div class="inner stack">
    <p class="mono">IT</p>
    <p style="font-style:italic;font-size:30px;color:#3A362C">For any questions, please contact us at:<br>isabellathomaswedding@example.com</p>
    <p class="caps" style="color:#1C1A15;margin-top:70px">With love</p>
    <p style="font-family:'Allura',cursive;font-size:150px;line-height:1;color:#1C1A15">Isabella &amp; Thomas</p>
    <p class="caps" style="color:#1C1A15;margin-top:60px">We hope you can join us</p>
    <table style="margin:40px auto 0;border-collapse:collapse">
      <tr>
        <td style="font-family:'Marcellus',serif;font-size:96px;color:#1C1A15;padding:0 40px">339</td>
        <td style="font-family:'Marcellus',serif;font-size:96px;color:#1C1A15">:</td>
        <td style="font-family:'Marcellus',serif;font-size:96px;color:#1C1A15;padding:0 40px">06</td>
        <td style="font-family:'Marcellus',serif;font-size:96px;color:#1C1A15">:</td>
        <td style="font-family:'Marcellus',serif;font-size:96px;color:#1C1A15;padding:0 40px">07</td>
      </tr>
      <tr>
        <td style="font-family:'Marcellus',serif;font-size:22px;letter-spacing:.3em;text-transform:uppercase;color:#6B6555;padding-top:10px">Days</td>
        <td></td>
        <td style="font-family:'Marcellus',serif;font-size:22px;letter-spacing:.3em;text-transform:uppercase;color:#6B6555;padding-top:10px">Hours</td>
        <td></td>
        <td style="font-family:'Marcellus',serif;font-size:22px;letter-spacing:.3em;text-transform:uppercase;color:#6B6555;padding-top:10px">Minutes</td>
      </tr>
    </table>
  </div>
</section>

</body>
</html>
