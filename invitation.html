<style>
:root{
  --ink:#171A2E; --ink-raised:#1F2338; --ivory:#F2EBDD; --ivory-dim:#C9C0B0;

}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--ink);color:var(--ivory);font-family:"EB Garamond",Georgia,serif;
  font-size:19px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}

/* ---------- the opening stage ---------- */
#stage{position:fixed;inset:0;z-index:40;background:

@keyframes pulse{0%,100%{opacity:.65}50%{opacity:1}}

#stage.playing #skip{display:block}

/* ---------- the invitation ---------- */

section{padding:88px 0;text-align:center}

<script>
"use strict";
/* ============================== engine =================================
   Three openings — knot | stars | petals — all vanilla canvas, no libs.
   The couple's content lives in the #cfg JSON block above. ?edit opens
   the visual editor, which can download a personalised copy of this file. */

const $ = s => document.querySelector(s);
const cfg = JSON.parse($('#cfg').textContent);
const Q = new URLSearchParams(location.search);
if (Q.get('opening')) cfg.opening = Q.get('opening');

/* ---------- palette -> css ---------- */
function applyPalette(){
  const r = document.documentElement.style, p = cfg.palette || {};
  if (p.ink)    r.setProperty('--ink', p.ink);
  if (p.ivory)  r.setProperty('--ivory', p.ivory);
  if (p.accent){r.setProperty('--accent', p.accent); r.setProperty('--accent-lift', lift(p.accent));}
}
function lift(hex){ // one step brighter for hovers and glows
  const n = parseInt(hex.slice(1),16);
  const c = v => Math.min(255, Math.round(v + (255-v)*0.28));
  return '#'+[c(n>>16&255),c(n>>8&255),c(n&255)].map(v=>v.toString(16).padStart(2,'0')).join('');
}

/* ---------- render the invitation from cfg ---------- */
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function render(){
  applyPalette();
  document.title = cfg.names + ' — you are invited';
  document.querySelectorAll('[data-bind]').forEach(el => { el.textContent = cfg[el.dataset.bind] ?? ''; });
  $('#tl-body').innerHTML = (cfg.events||[]).map(e => `
    <tr><td class="dt">${esc(e.date)}</td>
        <td><h4>${esc(e.label)}</h4>
            <p class="tm">${esc(e.time)} &middot; ${esc(e.venue)}</p>
            ${e.note ? `<p>${esc(e.note)}</p>` : ''}</td></tr>`).join('');
  $('#hotel-cards').innerHTML = (cfg.hotels||[]).map(h => `
    <div class="card"><h4>${esc(h.name)}</h4><p>${esc(h.lines)}${h.phone ? '\n'+esc(h.phone):''}</p>
      ${h.url && h.url !== '#' ? `<a href="${esc(h.url)}" target="_blank" rel="noopener">Visit website</a>`:''}</div>`).join('');
  $('#qa-list').innerHTML = (cfg.faqs||[]).map(f =>
    `<div><dt>${esc(f.q)}</dt><dd>${esc(f.a)}</dd></div>`).join('');
  $('#rsvp-link').href = cfg.rsvpUrl || '#';
  $('#story-list').innerHTML = (cfg.story||[]).map((s,i) => `
    <div class="story">
      <div class="ph">${s.photo ? `<img src="${esc(s.photo)}" alt="">` : `<span>${i+1}</span>`}</div>
      <div><h3>${esc(s.title)}</h3><p>${esc(s.text)}</p></div>
    </div>`).join('');
  if (cfg.musicUrl){ $('#music').style.display='block'; }
}

/* ---------- countdown ---------- */
let cdTimer;
function countdown(){
  clearInterval(cdTimer);
  const t = new Date(cfg.iso).getTime();
  const tick = () => {
    const d = Math.max(0, t - Date.now());
    $('#cd-d').textContent = Math.floor(d/864e5);
    $('#cd-h').textContent = String(Math.floor(d/36e5)%24).padStart(2,'0');
    $('#cd-m').textContent = String(Math.floor(d/6e4)%60).padStart(2,'0');
  };
  tick(); cdTimer = setInterval(tick, 30000);
}

/* ---------- text -> points sampler (shared by stars and petals) ---------- */
function samplePoints(text, fontPx, family, step){
  const w = 1400, h = 360, c = document.createElement('canvas');
  c.width = w; c.height = h;
  const x = c.getContext('2d');
  x.fillStyle = '#fff';
  x.font = fontPx + 'px ' + family;
  x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText(text, w/2, h/2);
  const img = x.getImageData(0,0,w,h).data, pts = [];
  for (let y = 0; y < h; y += step)
    for (let i = 0; i < w; i += step)
      if (img[(y*w+i)*4+3] > 128) pts.push({x: i/w, y: y/h});
  return pts;   // normalised inside a 1400x360 box, text centred
}

/* ---------- stage plumbing ---------- */
const stage = $('#stage'), cv = $('#cv'), ctx = cv.getContext('2d');
let W, H, DPR;
function fit(){
  DPR = Math.min(2, devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = W*DPR; cv.height = H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener('resize', fit); fit();

function reveal(){
  stage.classList.add('done');
  const site = $('#site');
  site.hidden = false;
  requestAnimationFrame(() => site.classList.add('in'));
  countdown();
  setTimeout(() => { stage.style.display = 'none'; }, 1100);
}

/* ================= the three openings =================
   Each factory returns {dur, draw(t)} where draw is a PURE function of t.
   One code path serves both drivers: tap-to-play advances t on a clock,
   scroll mode binds t to the scrollbar — forwards and backwards. */

const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

function makeKnot(){
  const dur = 7.2, cx = W/2, cy = H*0.42, K = 70;
  const accent = css('--accent') || '#C98A2B', ivory = css('--ivory') || '#F2EBDD';
  function head(t, side){
    if (t < 2.1){
      const p = Math.max(0, t/2.1), ease = p*p*(3-2*p);
      const x = side < 0 ? -40 + (cx+40)*ease : W+40 - (W-cx+40)*ease;
      const y = cy + side*44 + Math.sin(p*Math.PI*3 + (side<0?0:1.4))*H*0.06*(1-p*0.5);
      return {x, y};
    }
    const tt = t - 2.1;
    const r  = Math.max(52, 150 - tt*34);
    const a  = tt*3.1 + (side<0 ? 0 : Math.PI);
    return {x: cx + r*Math.cos(a), y: cy + r*0.62*Math.sin(a)};
  }
  function rosette(prog){
    ctx.beginPath();
    const n = Math.floor(150*prog);
    for (let i = 0; i <= n; i++){
      const th = i/150*Math.PI*2;
      const r  = 62*(0.62 + 0.38*Math.cos(3*th));
      const x  = cx + r*Math.cos(th), y = cy + r*0.9*Math.sin(th);
      i ? ctx.lineTo(x,y) : ctx.moveTo(x,y);
    }
    ctx.stroke();
  }
  function trail(t, side, col, fade){
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    let prev = null;
    for (let i = K; i >= 0; i--){        // the trail is the head's own past, recomputed
      const ti = t - i*0.02;
      if (ti < 0){prev = null; continue;}
      const q = head(ti, side);
      if (prev){
        const a = (1 - i/K)*0.9*fade;
        ctx.strokeStyle = col; ctx.globalAlpha = a;
        ctx.lineWidth = 1.1 + (1-i/K)*2.1;
        ctx.beginPath(); ctx.moveTo(prev.x, prev.y); ctx.lineTo(q.x, q.y); ctx.stroke();
      }
      prev = q;
    }
    ctx.globalAlpha = 1;
  }
  function draw(t){
    ctx.clearRect(0,0,W,H);
    const knotP = Math.min(1, Math.max(0, (t-4.4)/1.4));
    ctx.shadowColor = accent; ctx.shadowBlur = 14;
    if (t < 5.4){
      trail(Math.min(t,5.2), -1, accent, 1-knotP*0.85);
      trail(Math.min(t,5.2), +1, ivory, 1-knotP*0.85);
    }
    if (knotP > 0){
      ctx.strokeStyle = accent; ctx.lineWidth = 2.4;
      ctx.shadowBlur = 18; rosette(knotP);
      ctx.strokeStyle = 'rgba(242,235,221,.55)'; ctx.lineWidth = 1.1;
      ctx.shadowBlur = 0;
      ctx.save(); ctx.translate(0,3); rosette(knotP); ctx.restore();
    }
    const mgP = Math.min(1, Math.max(0, (t-5.3)/0.9));
    if (mgP > 0){
      ctx.globalAlpha = mgP; ctx.fillStyle = ivory;
      ctx.font = (26+8*mgP) + 'px Marcellus, serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(cfg.initials, cx, cy);
      ctx.font = '13px Marcellus, serif';
      ctx.fillStyle = accent; ctx.globalAlpha = mgP*0.9;
      ctx.fillText((cfg.dateLine||'').toUpperCase(), cx, cy + 118);
      ctx.globalAlpha = 1;
    }
    ctx.shadowBlur = 0;
  }
  return {dur, draw};
}

function makeStars(){
  const dur = 8.0;
  const bg = Array.from({length:130}, () => ({
    x: Math.random()*W, y: Math.random()*H,
    r: 0.5 + Math.random()*1.3, ph: Math.random()*Math.PI*2, in: Math.random()*1.8 }));
  let pts = samplePoints(cfg.initials, 190, 'Marcellus, serif', 13);
  const chain = [];
  if (pts.length){
    let cur = pts.reduce((m,p) => p.x < m.x ? p : m, pts[0]);
    const left = pts.slice();
    while (left.length){
      let bi = 0, bd = 1e9;
      for (let i = 0; i < left.length; i++){
        const d = (left[i].x-cur.x)**2 + (left[i].y-cur.y)**2;
        if (d < bd){bd = d; bi = i;}
      }
      cur = left.splice(bi,1)[0]; chain.push(cur);
    }
  }
  const bw = Math.min(W*0.86, 640), bh = bw*360/1400;
  const map = p => ({x: W/2 + (p.x-0.5)*bw, y: H*0.40 + (p.y-0.5)*bh});
  const accent = css('--accent') || '#C98A2B';
  function draw(t){
    ctx.clearRect(0,0,W,H);
    for (const s of bg){
      if (t < s.in) continue;
      const a = Math.min(1,(t-s.in)/1.2) * (0.35 + 0.3*Math.sin(t*1.7 + s.ph));
      ctx.globalAlpha = Math.max(0.06, a);
      ctx.fillStyle = '#DCD6C6';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
    const n = chain.length;
    const popP  = Math.min(1, Math.max(0, (t-1.6)/2.2));
    const lineP = Math.min(1, Math.max(0, (t-2.6)/2.6));
    const lit = Math.floor(n*popP);
    if (lineP > 0 && n > 1){
      ctx.strokeStyle = 'rgba(224,177,95,.5)'; ctx.lineWidth = 1;
      ctx.beginPath();
      const upto = Math.max(1, Math.floor(n*lineP));
      for (let i = 0; i < upto; i++){
        const q = map(chain[i]);
        i ? ctx.lineTo(q.x,q.y) : ctx.moveTo(q.x,q.y);
      }
      ctx.stroke();
    }
    ctx.shadowColor = accent;
    for (let i = 0; i < lit; i++){
      const q = map(chain[i]);
      const born = 1.6 + (i/n)*2.2, ag = t - born;
      const flash = ag < 0.45 && ag > 0 ? 1 + (0.45-ag)*4 : 1;
      ctx.shadowBlur = 10;
      ctx.fillStyle = '#F5EEDE';
      ctx.beginPath(); ctx.arc(q.x, q.y, 1.5*flash, 0, 7); ctx.fill();
    }
    ctx.shadowBlur = 0;
    const dP = Math.min(1, Math.max(0, (t-5.6)/1.0));
    if (dP > 0){
      ctx.globalAlpha = dP; ctx.fillStyle = accent;
      ctx.font = '15px Marcellus, serif';
      ctx.textAlign = 'center';
      ctx.fillText(((cfg.dateLine||'') + '  ·  ' + (cfg.city||'')).toUpperCase(), W/2, H*0.40 + bh/2 + 64);
      ctx.globalAlpha = 1;
    }
  }
  return {dur, draw};
}

function makePetals(){
  const dur = 7.5, G0 = 2.0, GD = 1.5, B0 = 5.7;
  const useInitials = W < 640;
  let targets = useInitials
    ? samplePoints(cfg.initials, 300, 'Marcellus, serif', 6)
    : samplePoints(cfg.names, 150, 'Allura, cursive', 7);
  const N = Math.min(430, Math.max(240, targets.length));
  if (targets.length > N) targets = targets.filter((_,i) => i % Math.ceil(targets.length/N) === 0);
  const bw = Math.min(W*0.92, 760), bh = bw*360/1400;
  const map = p => ({x: W/2 + (p.x-0.5)*bw, y: H*0.42 + (p.y-0.5)*bh});
  const P = Array.from({length:N}, (_, i) => {
    const z = 0.4 + Math.random()*0.6;
    return { x0: Math.random()*W, y0: Math.random()*H*1.5 - H*0.45, z,
      vy: (72+Math.random()*96)*z, sway0: Math.random()*Math.PI*2,
      rot0: Math.random()*Math.PI*2, vr: (Math.random()-0.5)*2.4,
      s: (5+Math.random()*8)*z, hue: 28 + Math.random()*16,
      tgt: targets.length ? map(targets[i % targets.length]) : null,
      bx: (Math.random()-0.5)*340, by: (Math.random()-0.5)*300 };
  });
  const span = H + 60;
  const rain = (p, t) => ({
    x: p.x0 + Math.sin(p.sway0 + t*1.8)*26*p.z,
    y: ((p.y0 + p.vy*t) % span + span) % span - 30,
    r: p.rot0 + p.vr*t });
  function petal(x, y, r, sz, hue, a){
    if (a <= 0) return;
    ctx.save(); ctx.translate(x,y); ctx.rotate(r);
    ctx.globalAlpha = a;
    ctx.fillStyle = `hsl(${hue} 72% ${46 + sz}%)`;
    ctx.beginPath();
    ctx.moveTo(0,-sz);
    ctx.quadraticCurveTo(sz*0.85, -sz*0.15, 0, sz);
    ctx.quadraticCurveTo(-sz*0.85, -sz*0.15, 0, -sz);
    ctx.fill(); ctx.restore();
  }
  function draw(t){
    ctx.clearRect(0,0,W,H);
    const gE = t > G0 ? (q => q*q*(3-2*q))(Math.min(1,(t-G0)/GD)) : 0;
    const holdEnd = Math.min(1, Math.max(0,(t-B0)/1.3));
    for (const p of P){
      let x, y, r;
      if (t >= B0 && p.tgt){
        const bt = t - B0;
        x = p.tgt.x + p.bx*bt*1.6; y = p.tgt.y + p.by*bt*1.6 + 60*bt*bt;
        r = p.rot0 + p.vr*(G0 + bt*3);
      } else if (t > G0 && p.tgt){
        const g = rain(p, G0);
        x = g.x + (p.tgt.x-g.x)*gE; y = g.y + (p.tgt.y-g.y)*gE;
        r = p.rot0 + p.vr*G0 + p.vr*(t-G0)*0.6;
      } else {
        const q = rain(p, t); x = q.x; y = q.y; r = q.r;
      }
      petal(x, y, r, p.s*(1 - gE*0.5), p.hue, (0.5 + p.z*0.5)*(1-holdEnd));
    }
  }
  return {dur, draw};
}

const OPENINGS = {knot: makeKnot, stars: makeStars, petals: makePetals};
async function fontsReady(){
  try { await Promise.all([
    document.fonts.load('190px Marcellus'), document.fonts.load('150px Allura'),
    document.fonts.ready ]); } catch(e){}
}

/* ---------- driver 1: tap to play ---------- */
let raf, started = false;
async function start(){
  if (started) return; started = true;
  stage.classList.add('playing');
  startMusic();
  await fontsReady();
  const mod = (OPENINGS[cfg.opening] || makeKnot)();
  let t0;
  const step = now => {
    if (!t0) t0 = now - (parseFloat(Q.get('at'))||0)*1000;
    const t = (now - t0)/1000;
    mod.draw(t);
    if (t >= mod.dur) return reveal();
    raf = requestAnimationFrame(step);
  };
  raf = requestAnimationFrame(step);
}
function skipAll(){ cancelAnimationFrame(raf); reveal(); }

/* ---------- driver 2: the scrollbar is the timeline ---------- */
async function initScroll(){
  await fontsReady();
  const mod = (OPENINGS[cfg.opening] || makeKnot)();
  const runway = document.createElement('div');
  runway.id = 'runway'; runway.style.height = '320vh';
  document.body.insertBefore(runway, $('#site'));
  const hint = document.createElement('div');
  hint.id = 'scroll-hint'; hint.textContent = 'Scroll to open';
  document.body.appendChild(hint);
  stage.classList.add('scrub');
  $('#site').hidden = false; $('#site').classList.add('in');
  countdown();
  let musicArmed = false;
  addEventListener('touchstart', () => { if(!musicArmed){musicArmed = true; startMusic();} }, {once:true, passive:true});
  const onScroll = () => {
    const max = runway.offsetHeight - innerHeight*0.55;
    const p = Math.min(1, Math.max(0, scrollY/max));
    mod.draw(p*mod.dur);
    stage.style.opacity = p < 0.9 ? 1 : Math.max(0, 1-(p-0.9)/0.1);
    stage.style.visibility = p >= 1 ? 'hidden' : 'visible';
    hint.classList.toggle('off', scrollY > 40);
  };
  addEventListener('scroll', onScroll, {passive:true});
  addEventListener('resize', onScroll);
  onScroll();
}

function startMusic(){
  if (!cfg.musicUrl) return;
  try {
    let au = $('#bg-music');
    if (!au){ au = document.createElement('audio'); au.id='bg-music'; au.loop = true; au.src = cfg.musicUrl; document.body.appendChild(au); }
    au.play(); $('#music').textContent = '❚❚';
  } catch(e){}
}
$('#invite-hint').addEventListener('click', start);
$('#skip').addEventListener('click', skipAll);
$('#music').addEventListener('click', () => {
  const au = $('#bg-music'); if (!au) return;
  if (au.paused){au.play(); $('#music').textContent='❚❚';} else {au.pause(); $('#music').textContent='♫';}
});

/* ---------- sections rise as they enter view ---------- */
function initReveals(){
  document.querySelectorAll('#site section').forEach(sec => {
    sec.querySelectorAll('.col > *').forEach((el, i) => {
      el.classList.add('rv');
      el.style.transitionDelay = Math.min(i*110, 440) + 'ms';
    });
  });
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) e.target.classList.add('in');
  }), {threshold: 0.12});
  document.querySelectorAll('.rv').forEach(el => io.observe(el));
}

/* ---------- editor ---------- */
function buildEditor(){
  document.body.classList.add('editing');
  $('#site').hidden = false; $('#site').classList.add('in'); countdown();
  const ed = document.createElement('div'); ed.id = 'editor';
  const F = (label, val, key, kind) => `
    <label>${label}</label>
    ${kind === 'area'
      ? `<textarea data-k="${key}">${esc(val)}</textarea>`
      : `<input type="${kind||'text'}" data-k="${key}" value="${esc(val)}">`}`;
  ed.innerHTML = `
    <button class="close" title="Close">&times;</button>
    <h2>Make it yours</h2>
    <p class="hint">Everything updates live behind this panel. When it is right, press
      Download — you get your own copy of this file, ready to share or host.</p>
    ${F('Couple', cfg.names, 'names')}
    ${F('Initials (on the opening)', cfg.initials, 'initials')}
    ${F('Intro line', cfg.tagline, 'tagline')}
    <div class="row">${F('Date shown', cfg.dateLine, 'dateLine')}${F('City', cfg.city, 'city')}</div>
    ${F('Wedding date & time (for the countdown)', cfg.iso.slice(0,16), 'iso', 'datetime-local')}
    ${F('Welcome note', cfg.welcome, 'welcome', 'area')}
    <div class="row"><div>
    <label>Opening animation</label>
    <select data-k="opening">
      ${['knot','stars','petals'].map(o => `<option ${cfg.opening===o?'selected':''}>${o}</option>`).join('')}
    </select></div><div>
    <label>How it opens</label>
    <select data-k="openingMode">
      ${[['scroll','guests scroll it open'],['tap','tap to play']].map(([v,l]) =>
        `<option value="${v}" ${cfg.openingMode===v?'selected':''}>${l}</option>`).join('')}
    </select></div></div>
    <fieldset><legend>Events</legend><div id="ev-list">
      ${cfg.events.map((e,i) => `
        <div class="row">${F('Event '+(i+1), e.label, 'events.'+i+'.label')}${F('Date', e.date, 'events.'+i+'.date')}</div>
        <div class="row">${F('Time', e.time, 'events.'+i+'.time')}${F('Venue', e.venue, 'events.'+i+'.venue')}</div>
        ${F('Note', e.note, 'events.'+i+'.note')}`).join('<hr style="border:0;border-top:1px dashed #D8CDB4;margin:12px 0">')}
    </div>
    <p class="hint" style="margin-top:10px">Fewer events? Blank an event's name and it disappears.</p></fieldset>
    <fieldset><legend>Stay</legend>
      ${cfg.hotels.map((h,i) => `
        ${F('Hotel '+(i+1), h.name, 'hotels.'+i+'.name')}
        ${F('Lines', h.lines, 'hotels.'+i+'.lines', 'area')}
        <div class="row">${F('Phone', h.phone, 'hotels.'+i+'.phone')}${F('Link', h.url, 'hotels.'+i+'.url')}</div>`).join('')}
      ${F('Transport note', cfg.hotelNote, 'hotelNote', 'area')}
      ${F('What to wear', cfg.wear, 'wear', 'area')}
    </fieldset>
    <fieldset><legend>Good to know</legend>
      ${cfg.faqs.map((f,i) => `<div class="row">${F('Q', f.q, 'faqs.'+i+'.q')}${F('A', f.a, 'faqs.'+i+'.a')}</div>`).join('')}
    </fieldset>
    <fieldset><legend>RSVP</legend>
      ${F('RSVP form link (Google Form works well)', cfg.rsvpUrl, 'rsvpUrl')}
      <div class="row">${F('Reply by', cfg.rsvpBy, 'rsvpBy')}${F('Email', cfg.email, 'email')}</div>
    </fieldset>
    <fieldset><legend>Our story</legend>
      ${cfg.story.map((s,i) => `
        ${F('Moment '+(i+1), s.title, 'story.'+i+'.title')}
        ${F('Text', s.text, 'story.'+i+'.text', 'area')}
        ${F('Photo link (optional)', s.photo, 'story.'+i+'.photo')}`).join('')}
    </fieldset>
    <fieldset><legend>Look</legend>
      <div class="row">
        <div><label>Background</label><input type="color" data-k="palette.ink" value="${cfg.palette.ink}"></div>
        <div><label>Accent</label><input type="color" data-k="palette.accent" value="${cfg.palette.accent}"></div>
      </div>
      ${F('Music link (optional, mp3)', cfg.musicUrl, 'musicUrl')}
    </fieldset>
    <button class="dl">Download my invitation</button>`;
  document.body.appendChild(ed);
  ed.addEventListener('input', e => {
    const k = e.target.dataset.k; if (!k) return;
    let v = e.target.value;
    const path = k.split('.');
    let o = cfg;
    while (path.length > 1){ o = o[isNaN(path[0]) ? path[0] : +path[0]]; path.shift(); }
    o[isNaN(path[0]) ? path[0] : +path[0]] = v;
    if (k === 'iso') cfg.iso = v;
    cfg.events = cfg.events.filter(x => x.label !== '');
    render(); countdown();
  });
  ed.querySelector('.close').addEventListener('click', () => {
    ed.remove(); document.body.classList.remove('editing');
  });
  ed.querySelector('.dl').addEventListener('click', bake);
}
function bake(){
  $('#cfg').textContent = '\n' + JSON.stringify(cfg, null, 1) + '\n';
  const clone = document.documentElement.cloneNode(true);
  clone.querySelector('#editor')?.remove();
  clone.querySelector('body').className = '';
  const st = clone.querySelector('#stage');
  st.className = ''; st.style.display = '';
  const si = clone.querySelector('#site');
  si.setAttribute('hidden',''); si.className = '';
  clone.querySelector('#bg-music')?.remove();
  clone.querySelector('#runway')?.remove();
  clone.querySelector('#scroll-hint')?.remove();
  st.style.opacity = ''; st.style.visibility = '';
  clone.querySelectorAll('.rv').forEach(el => {
    el.classList.remove('rv','in'); el.style.transitionDelay = '';
  });
  const blob = new Blob(['<!doctype html>\n' + clone.outerHTML], {type:'text/html'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (cfg.names.replace(/[^a-z0-9]+/gi,'-').toLowerCase() || 'wedding') + '-invitation.html';
  a.click();
}

/* ---------- boot ---------- */
render();
initReveals();
const mode = Q.get('mode') || cfg.openingMode || 'tap';
if (matchMedia('(prefers-reduced-motion: reduce)').matches || Q.has('skip')){
  skipAll();
} else if (Q.has('edit') || location.hash === '#edit'){
  buildEditor();
} else if (mode === 'scroll'){
  initScroll();
} else if (Q.has('auto')){
  start();
}
</script>
</body>
</html>
