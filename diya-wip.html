<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Diya's Journey — stage 1: the rig</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#05060E}
#track{height:800vh}
#gl{position:fixed;inset:0;z-index:1}
#hud{position:fixed;left:10px;top:10px;z-index:10;font:12px/1.5 ui-monospace,monospace;
  color:#9aa; background:rgba(5,6,14,.6);padding:6px 10px;border-radius:4px;pointer-events:none}
#hint{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:10;
  font:11px ui-sans-serif,system-ui;letter-spacing:.35em;text-transform:uppercase;color:#667}
</style>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.14/dist/lenis.min.js"></script>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
</script>
</head>
<body>
<canvas id="gl"></canvas>
<div id="track"></div>
<div id="hud">p 0.000 · fps —</div>
<div id="hint">Scroll</div>

<script type="module">
/* ============ STAGE 1 — THE RIG ============
   Judged on one thing only: does scrubbing feel buttery, forwards and backwards.
   A placeholder diya (glowing box) rides a spline; the camera follows a second
   spline and looks slightly ahead. Everything is a pure function of p. */
import * as THREE from "three";

const canvas = document.getElementById("gl");
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05060e);
scene.fog = new THREE.FogExp2(0x05060e, 0.055);
const cam = new THREE.PerspectiveCamera(52, 1, 0.1, 200);

function fit(){
  renderer.setSize(innerWidth, innerHeight, false);
  cam.aspect = innerWidth/innerHeight; cam.updateProjectionMatrix();
}
addEventListener("resize", fit); fit();

/* ---- the river path: a gentle meander down -Z ---- */
const bend = (z, amp) => new THREE.Vector3(amp, 0, z);
const PATH = new THREE.CatmullRomCurve3([
  bend(  0,  0), bend(-14, 3.2), bend(-28, -4.0), bend(-44, 2.2),
  bend(-60, -3.4), bend(-76, 1.6), bend(-92, -2.0), bend(-108, 0),
], false, "catmullrom", 0.6);

/* ---- placeholder water: a dark plane with a dot grid so motion is visible ---- */
{
  const g = new THREE.PlaneGeometry(80, 260, 1, 1);
  const m = new THREE.MeshBasicMaterial({color:0x0a0e1e});
  const water = new THREE.Mesh(g, m);
  water.rotation.x = -Math.PI/2; water.position.set(0, -0.001, -100);
  scene.add(water);
  const dots = new THREE.BufferGeometry();
  const P = [];
  for (let i = 0; i < 1600; i++)
    P.push((Math.random()-0.5)*60, 0.01, -Math.random()*240);
  dots.setAttribute("position", new THREE.Float32BufferAttribute(P, 3));
  scene.add(new THREE.Points(dots, new THREE.PointsMaterial({color:0x2a3352, size:0.06})));
}

/* ---- placeholder diya: a warm glowing box + halo sprite ---- */
const diya = new THREE.Group();
{
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(0.5, 0.22, 0.5),
    new THREE.MeshBasicMaterial({color:0xc98a2b}));
  const halo = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTexture(), color:0xffc873, transparent:true,
    blending:THREE.AdditiveBlending, depthWrite:false}));
  halo.scale.setScalar(3.2); halo.position.y = 0.35;
  diya.add(body, halo);
  scene.add(diya);
}
function glowTexture(){
  const c = document.createElement("canvas"); c.width = c.height = 128;
  const x = c.getContext("2d");
  const g = x.createRadialGradient(64,64,0,64,64,64);
  g.addColorStop(0,"rgba(255,220,160,1)"); g.addColorStop(0.35,"rgba(255,190,110,.35)");
  g.addColorStop(1,"rgba(255,190,110,0)");
  x.fillStyle = g; x.fillRect(0,0,128,128);
  return new THREE.CanvasTexture(c);
}

/* ---- gate markers every 12 units so speed is readable in stage 1 ---- */
for (let z = -12; z > -100; z -= 12){
  const u = clamp01(-z/108);
  const at = PATH.getPointAt(u);
  const post = new THREE.Mesh(
    new THREE.CylinderGeometry(0.06, 0.06, 3, 6),
    new THREE.MeshBasicMaterial({color:0x27304e}));
  post.position.set(at.x + 2.4, 1.5, at.z);
  const post2 = post.clone(); post2.position.x = at.x - 2.4;
  scene.add(post, post2);
}
function clamp01(v){ return Math.min(1, Math.max(0, v)); }

/* ---- the scrub: Lenis feeds ScrollTrigger; p drives the world ---- */
let p = 0;
const lenis = new Lenis({lerp: 0.09, wheelMultiplier: 0.9});
window.__lenis = lenis;                                  // QA handle
lenis.on("scroll", ScrollTrigger.update);
gsap.ticker.add(t => lenis.raf(t*1000));
gsap.ticker.lagSmoothing(0);
gsap.registerPlugin(ScrollTrigger);
ScrollTrigger.create({
  trigger: "#track", start: "top top", end: "bottom bottom",
  scrub: true,
  onUpdate: self => { p = self.progress; }
});

/* ---- camera rig: pure f(p) ---- */
const easeP = t => t;                                     // stage 1: linear; shape later
function rig(){
  const u  = easeP(p) * 0.96;
  const at = PATH.getPointAt(u);
  const ahead = PATH.getPointAt(Math.min(1, u + 0.012));
  const far   = PATH.getPointAt(Math.min(1, u + 0.05));
  diya.position.set(ahead.x, 0.12 + Math.sin(p*60)*0.015, ahead.z);
  const back = at.clone().sub(far).normalize().multiplyScalar(3.4);
  cam.position.set(at.x + back.x, 1.55, at.z + back.z);
  cam.lookAt(far.x, 0.4, far.z);
}

/* ---- loop + hud ---- */
const hud = document.getElementById("hud");
let frames = 0, last = performance.now(), fps = 0;
renderer.setAnimationLoop(() => {
  rig();
  renderer.render(scene, cam);
  frames++;
  const now = performance.now();
  if (now - last > 500){
    fps = Math.round(frames*1000/(now-last)); frames = 0; last = now;
    hud.textContent = `p ${p.toFixed(3)} · fps ${fps}`;
  }
});

/* ---- QA: deterministic single-frame render, immune to rAF throttling.
   Everything is f(p), so one direct call draws the exact frame. ---- */
window.__setP = v => {
  p = Math.min(1, Math.max(0, v));
  rig();
  renderer.render(scene, cam);
  hud.textContent = `p ${p.toFixed(3)} · direct`;
  return p;
};

/* ---- QA: ?p=0.5 jumps the film ---- */
const Q = new URLSearchParams(location.search);
if (Q.get("p")){
  const target = parseFloat(Q.get("p")) *
    (document.getElementById("track").offsetHeight - innerHeight);
  requestAnimationFrame(() => lenis.scrollTo(target, {immediate:true}));
}
</script>
</body>
</html>
